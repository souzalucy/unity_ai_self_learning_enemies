# Shooter Training Configuration
# Uses PPO + Curiosity (ICM) for sparse-reward exploration.
# mlagents-learn shooter_trainer_config.yaml --run-id=Shooter_Enemy_01

behaviors:
  EnemyBrain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: null
      deterministic: false

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2

      curiosity:
        gamma: 0.99
        strength: 0.02
        network_settings:
          normalize: false
          hidden_units: 256
          num_layers: 2
        learning_rate: 3.0e-4

    max_steps: 10000000
    time_horizon: 256
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 100000
    threaded: true
